# Publishes n8n-nodes-socioi to npm with provenance (required by n8n Creator Portal).
#
# ONE-TIME SETUP (pick one):
#
# Option A — OIDC Trusted Publishing (recommended):
# 1. https://www.npmjs.com/package/n8n-nodes-socioi → Settings → Trusted Publishers
# 2. Add GitHub Actions publisher:
#      Repository owner: badarhse
#      Repository name:  n8n-nodes-socioi
#      Workflow name:    publish.yml
#      Environment:      (leave blank)
# 3. Leave NPM_TOKEN unset in this repo.
#
# Option B — Granular npm token:
# 1. Create a granular token with Read and write + Bypass 2FA
# 2. GitHub → Settings → Secrets → Actions → NPM_TOKEN
#
# RELEASE:
#   npm version patch   # or minor / major
#   git push origin main --follow-tags

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish with provenance
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Using NPM_TOKEN for auth"
          else
            echo "Using OIDC Trusted Publisher for auth"
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
